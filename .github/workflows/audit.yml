name: Weekly dependency audit

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.18"
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: uv export --locked --all-extras --no-emit-project -o "$RUNNER_TEMP/requirements-audit.txt"
      - run: uv run pip-audit -r "$RUNNER_TEMP/requirements-audit.txt" --disable-pip --require-hashes
