name: Release

# PREPARED ONLY. It runs when a GitHub release is *published*, which is a manual decision of
# the maintainer (see RELEASING.md). Nothing here is triggered by pushes, tags or PRs.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Passed through the environment, never interpolated into a shell command.
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
      - run: uv sync --locked --all-extras
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest --cov
      - run: uv build
      - name: The tag must match the package version
        run: |
          version=$(uv run python -c "import injectkit; print(injectkit.__version__)")
          if [ "v${version}" != "${RELEASE_TAG}" ]; then
            echo "tag ${RELEASE_TAG} does not match package version v${version}" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The `pypi` environment is created and protected by the maintainer (required reviewers).
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write # PyPI trusted publishing (OIDC); no API token is stored anywhere
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
