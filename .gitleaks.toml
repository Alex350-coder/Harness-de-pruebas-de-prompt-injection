title = "InjectKit gitleaks config"

[extend]
useDefault = true

# Rules.md #2/#6: the only allowance. One published dummy value used as a fake API key in
# tests (it is not a credential). Scoped to tests/ and to this exact string, so a real
# token anywhere, or any other value in tests/, is still reported.
[[allowlists]]
description = "Dummy API key used by CLI/config tests"
condition = "AND"
paths = ['''^tests/.*\.py$''']
regexes = ['''^tok-12345-abcdef$''']
