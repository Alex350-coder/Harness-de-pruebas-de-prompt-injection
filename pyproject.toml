[project]
name = "injectkit"
version = "0.1.0.dev0"
description = "CLI for authorized prompt-injection testing of LLM-powered HTTP applications."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "TODO-USER" }]
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6",
    "jinja2>=3.1",
]

[project.optional-dependencies]
demo = ["fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
injectkit = "injectkit.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "anyio>=4",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
    "pip-audit>=2.7",
    "jsonschema>=4",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
# S101 (assert) is the only security rule relaxed, and only in tests.
"tests/**" = ["S101"]

[tool.mypy]
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]
anyio_mode = "auto"

[tool.coverage.run]
source = ["src/injectkit"]
omit = ["*/demo/*"]

[tool.coverage.report]
fail_under = 85
show_missing = true
